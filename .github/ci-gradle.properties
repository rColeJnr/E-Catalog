# Gradle settings for CI, copied to ~/.gradle/gradle.properties by the workflows (they take
# precedence over the project's gradle.properties). Adapted from Now in Android.

# One-off builds on a fresh machine: a daemon only costs memory
org.gradle.daemon=false
org.gradle.parallel=true
# GitHub's Linux runners have 4 cores and 16 GB
org.gradle.workers.max=3
org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=true

# Nothing to be incremental against on CI
kotlin.incremental=false

# Kotlin warnings don't fail the build (same as locally)
warningsAsErrors=false

# Record test coverage in debug builds (off locally; see build-logic Jacoco.kt)
ecsCoverage=true

# Never upload the R8 mapping to Crashlytics from CI (it needs the Firebase credentials, and CI
# release builds aren't the ones shipped)
skipMappingUpload=true
