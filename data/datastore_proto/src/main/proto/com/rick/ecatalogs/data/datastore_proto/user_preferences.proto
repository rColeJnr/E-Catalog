syntax = "proto3";

option java_package = "com.rick.ecatalogs.data.datastore";
option java_multiple_files = true;

message UserPreferences {
  map<string, bool> bestseller_favorite_ids = 1;
  map<int32, bool> gutenberg_favorite_ids = 2;
  map<int32, bool> trending_movie_favorite_ids = 3;
  map<int32, bool> trending_series_favorite_ids = 4;
  map<string, bool> ny_times_articles_favorite_ids = 5;
  map<int32, bool> anime_favorite_ids = 6;
  map<int32, bool> manga_favorite_ids = 7;

  string user_name = 8;

  map<int32, bool> notified_trending_movies_ids = 9;
  map<int32, bool> notified_trending_series_ids = 10;
  map<string, bool> notified_articles_ids = 11;

  // Top anime / manga (first page) seen by the last background sync (new ones are notified)
  map<int32, bool> notified_trending_anime_ids = 12;
  map<int32, bool> notified_trending_manga_ids = 13;

  map<string, bool> notified_bestseller_ids = 14;

  // Settings. Flags are negative so the proto default (false) means "enabled".
  // 0 = dark (default, the app is dark-first), 1 = light, 2 = follow system
  int32 theme = 15;
  bool sync_disabled = 16;
  // 0 = default (12 hours)
  int32 sync_interval_hours = 17;
  bool notifications_disabled_movies = 18;
  bool notifications_disabled_series = 19;
  bool notifications_disabled_articles = 20;
  bool notifications_disabled_bestsellers = 21;
  // When background sync last completed successfully (0 = never). The startup sync is skipped
  // while this is more recent than the chosen sync interval.
  int64 last_sync_epoch_millis = 22;
  // When each catalog list was last downloaded (epoch millis), keyed by list (see ListCache).
  // Screens reuse the stored list while it's younger than the sync interval.
  map<string, int64> list_refreshed_at = 23;
  // Movies the user asked to be reminded about on release day, by TMDB id.
  map<int32, ReleaseReminder> release_reminders = 24;
  // IGDB ids of the user's favorite games
  map<int32, bool> game_favorite_ids = 25;
  bool notifications_disabled_games = 26;
  // "Coming soon" games seen by the last background sync (new ones are notified)
  map<int32, bool> notified_coming_soon_game_ids = 27;
  bool notifications_disabled_anime = 28;
  bool notifications_disabled_manga = 29;

  // Next available is 30
}

message ReleaseReminder {
  string title = 1;
  // yyyy-MM-dd
  string release_date = 2;
}